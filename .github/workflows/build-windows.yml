name: بناء نسخة ويندوز

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: تثبيت الاعتماديات
        run: npm install
        working-directory: midad-desktop

      - name: بناء المُثبِّت وملفات التحديث
        run: npm run dist
        working-directory: midad-desktop

      - name: رفع المخرجات كأرشيف
        uses: actions/upload-artifact@v4
        with:
          name: midad-studio-windows
          path: |
            midad-desktop/release/*.exe
            midad-desktop/release/latest.yml
            midad-desktop/release/*.blockmap
          if-no-files-found: error

      - name: نشر الإصدار (عند دفع وسم v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            midad-desktop/release/*.exe
            midad-desktop/release/latest.yml
            midad-desktop/release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}